<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sehat Saathi — food health companion</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2B1118">
<link rel="icon" href="icon-192.png">
<style>
  :root{
    --bg:#211016;
    --surface:#33181F;
    --surface-2:#3F1F28;
    --border:#4E2B33;
    --text:#F4EDE4;
    --text-dim:#C9B9AE;
    --text-faint:#8E7A70;
    --accent:#E8A33D;
    --accent-text:#2B1809;
    --safe:#7FA66B;
    --safe-text:#1B2613;
    --warn:#D99B3D;
    --warn-text:#2E1F08;
    --danger:#D9583B;
    --danger-text:#330D04;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    -webkit-tap-highlight-color:transparent;
    padding-bottom:78px;
  }
  h1,h2,h3{font-family:Georgia,"Times New Roman",serif; font-weight:600; margin:0;}
  header{
    position:sticky; top:0; z-index:10; background:var(--bg);
    padding:18px 18px 14px; border-bottom:0.5px solid var(--border);
    display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  header h1{font-size:19px; letter-spacing:0.2px;}
  .lock-badge{
    display:flex; align-items:center; gap:5px; font-size:11px;
    padding:4px 9px; border-radius:20px; background:rgba(127,166,107,0.15); color:var(--safe);
    white-space:nowrap;
  }
  main{padding:18px; max-width:520px; margin:0 auto;}
  .screen{display:none;}
  .screen.active{display:block;}
  select, input[type=text]{
    background:var(--surface); color:var(--text); border:0.5px solid var(--border);
    border-radius:10px; padding:10px 12px; font-size:14px; width:100%;
  }
  select{appearance:none;}
  label.field{display:block; font-size:12px; color:var(--text-dim); margin:0 0 6px;}
  .row{display:flex; gap:10px; align-items:center;}
  button{
    font-family:inherit; cursor:pointer; border:none; border-radius:10px;
    background:var(--surface-2); color:var(--text); padding:10px 14px; font-size:14px;
  }
  button:active{transform:scale(0.98);}
  .chip{
    display:flex; align-items:center; gap:8px; font-size:13px; padding:10px 12px;
    border-radius:10px; border:0.5px solid var(--border); background:var(--surface);
    text-align:left;
  }
  .chip.active{background:rgba(232,163,61,0.18); border-color:var(--accent); color:var(--accent);}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  .card{background:var(--surface); border:0.5px solid var(--border); border-radius:14px; padding:14px 16px; margin-bottom:12px;}
  .pill{font-size:11px; padding:2px 9px; border-radius:20px; font-weight:600;}
  .pill.safe{background:var(--safe); color:var(--safe-text);}
  .pill.medium{background:var(--warn); color:var(--warn-text);}
  .pill.high{background:var(--danger); color:var(--danger-text);}
  .mic-wrap{display:flex; flex-direction:column; align-items:center; padding:30px 0 18px;}
  #micBtn{
    width:96px; height:96px; border-radius:50%; background:var(--accent); color:var(--accent-text);
    font-size:30px; display:flex; align-items:center; justify-content:center;
    border:none; position:relative;
  }
  #micBtn.listening{background:var(--danger); color:#fff;}
  #micBtn .pulse{
    position:absolute; inset:-10px; border-radius:50%; border:2px solid var(--danger);
    opacity:0; animation:none;
  }
  #micBtn.listening .pulse{animation:pulse 1.6s ease-out infinite;}
  @keyframes pulse{
    0%{opacity:0.6; transform:scale(0.9);}
    100%{opacity:0; transform:scale(1.5);}
  }
  .mic-label{font-size:13px; color:var(--text-dim); margin-top:12px; text-align:center;}
  #liveTranscript{
    margin-top:14px; min-height:20px; font-size:13px; color:var(--text-faint);
    text-align:center; padding:0 10px; font-style:italic;
  }
  nav.tabbar{
    position:fixed; bottom:0; left:0; right:0; background:var(--bg);
    border-top:0.5px solid var(--border); display:flex; padding:8px 6px calc(8px + env(safe-area-inset-bottom));
    z-index:10;
  }
  nav.tabbar button{
    flex:1; background:none; display:flex; flex-direction:column; align-items:center; gap:3px;
    font-size:11px; color:var(--text-faint); padding:6px 2px;
  }
  nav.tabbar button.active{color:var(--accent);}
  nav.tabbar .ic{font-size:18px;}
  .empty{font-size:13px; color:var(--text-faint); text-align:center; padding:30px 10px;}
  .hist-item{display:flex; justify-content:space-between; align-items:flex-start; gap:10px; padding:12px 0; border-bottom:0.5px solid var(--border);}
  .hist-item:last-child{border-bottom:none;}
  .hist-time{font-size:11px; color:var(--text-faint); white-space:nowrap;}
  .danger-btn{background:rgba(217,88,59,0.18); color:var(--danger);}
  .section-label{font-size:12px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.6px; margin:22px 0 10px;}
  .section-label:first-child{margin-top:0;}
  small.note{display:block; font-size:11.5px; color:var(--text-faint); line-height:1.5; margin-top:16px;}
</style>
</head>
<body>

<header>
  <h1 id="appTitle">Sehat Saathi</h1>
  <span class="lock-badge">&#128274; <span id="badgeText">On this phone only</span></span>
</header>

<main>

  <!-- HOME -->
  <section class="screen active" id="screen-home">
    <div class="mic-wrap">
      <button id="micBtn"><span class="pulse"></span><span id="micIcon">&#127908;</span></button>
      <div class="mic-label" id="micLabel">Tap to start listening</div>
    <div id="liveTranscript"></div>
    <div style="font-size:11px; color:var(--text-faint); margin-top:6px;" id="listenNote"></div>
    </div>

    <div class="row" style="margin:18px 0 22px;">
      <input type="text" id="manualInput" placeholder="Or type what you're eating...">
      <button id="manualBtn">Check</button>
    </div>

    <div id="homeFeed"></div>
  </section>

  <!-- PROFILE -->
  <section class="screen" id="screen-profile">
    <div class="section-label" id="lblConditions">Your health profile</div>
    <div class="grid2" id="conditionGrid"></div>
    <small class="note" id="noteProfile">Saved only in this browser's local storage on this device. Nothing is uploaded.</small>
  </section>

  <!-- HISTORY -->
  <section class="screen" id="screen-history">
    <div class="section-label" id="lblHistory">Recent notifications</div>
    <div id="historyList"></div>
  </section>

  <!-- SETTINGS -->
  <section class="screen" id="screen-settings">
    <div class="section-label" id="lblLanguage">Language</div>
    <select id="langSelect">
      <option value="hi">हिंदी</option>
      <option value="mr">मराठी</option>
      <option value="en">English</option>
    </select>

    <div class="section-label" id="lblVoice">Voice advice</div>
    <button class="chip" id="voiceToggleBtn" style="width:100%; justify-content:space-between;">
      <span id="voiceToggleLabel">Speak advice aloud</span>
      <span id="voiceToggleState">On</span>
    </button>
    <button id="testVoiceBtn" style="width:100%; margin-top:8px;">🔊 <span id="testVoiceLabel">Test this voice</span></button>
    <div id="voiceInfo" style="font-size:11px; color:var(--text-faint); margin-top:6px;"></div>

    <div class="section-label" id="lblPrivacy">Privacy</div>
    <div class="card" style="font-size:13px; color:var(--text-dim); line-height:1.6;" id="privacyText"></div>

    <div class="section-label" id="lblData">Your data</div>
    <button class="danger-btn" id="clearBtn" style="width:100%;" id="clearBtnLabel">Delete all my data from this phone</button>
  </section>

</main>

<nav class="tabbar">
  <button class="tab active" data-tab="home"><span class="ic">&#127858;</span><span data-i18n="tabHome">Home</span></button>
  <button class="tab" data-tab="profile"><span class="ic">&#10084;</span><span data-i18n="tabProfile">Profile</span></button>
  <button class="tab" data-tab="history"><span class="ic">&#128340;</span><span data-i18n="tabHistory">History</span></button>
  <button class="tab" data-tab="settings"><span class="ic">&#9881;</span><span data-i18n="tabSettings">Settings</span></button>
</nav>

const SPEECH_LOCALE = {en:'en-IN', hi:'hi-IN', mr:'mr-IN'};

/* ---------------- Storage (local only) ---------------- */
const STORE_KEY = 'sehatSaathi.v1';
function loadStore(){
  try{
    const s = JSON.parse(localStorage.getItem(STORE_KEY));
    return s || {conditions:[], lang:'hi', history:[], voiceOn:true};
  }catch(e){ return {conditions:[], lang:'hi', history:[], voiceOn:true}; }
}
function saveStore(){ localStorage.setItem(STORE_KEY, JSON.stringify(store)); }
let store = loadStore();

/* ---------------- i18n + render helpers ---------------- */
function t(key){ return (UI[store.lang] && UI[store.lang][key]) || UI.en[key]; }
function name(obj){ return obj[store.lang] || obj.en; }

function applyStaticText(){
  document.getElementById('appTitle').textContent = t('appTitle');
  document.getElementById('badgeText').textContent = t('badge');
  document.getElementById('micLabel').textContent = recognizing ? t('listening') : t('tapToListen');
  document.getElementById('manualInput').placeholder = t('manualPlaceholder');
  document.getElementById('manualBtn').textContent = t('checkBtn');
  document.getElementById('lblConditions').textContent = t('conditions');
  document.getElementById('noteProfile').textContent = UI[store.lang].privacyBody.split('.')[0] + '.';
  document.getElementById('lblHistory').textContent = t('historyTitle');
  document.getElementById('lblLanguage').textContent = t('language');
  document.getElementById('lblVoice').textContent = t('voiceSection');
  document.getElementById('voiceToggleLabel').textContent = t('voiceLabel');
  document.getElementById('voiceToggleState').textContent = store.voiceOn ? t('voiceOn') : t('voiceOff');
  document.getElementById('listenNote').textContent = t('listenNote');
  document.getElementById('lblPrivacy').textContent = t('privacy');
  document.getElementById('lblData').textContent = t('dataSection');
  document.getElementById('clearBtn').textContent = t('clearBtn');
  document.getElementById('privacyText').textContent = t('privacyBody');
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    el.textContent = t(el.getAttribute('data-i18n'));
  });
  document.getElementById('langSelect').value = store.lang;
}

function renderConditions(){
  const grid = document.getElementById('conditionGrid');
  grid.innerHTML = '';
  CONDITIONS.forEach(c=>{
    const active = store.conditions.includes(c.id);
    const btn = document.createElement('button');
    btn.className = 'chip' + (active ? ' active' : '');
    btn.innerHTML = `<span>${c.ic}</span><span>${name(c)}</span>`;
    btn.onclick = ()=>{
      if(active) store.conditions = store.conditions.filter(x=>x!==c.id);
      else store.conditions.push(c.id);
      saveStore();
      renderConditions();
    };
    grid.appendChild(btn);
  });
}

function riskCardHTML(food, level, message){
  const pillClass = level === 'safe' ? 'safe' : (level === 'high' ? 'high' : 'medium');
  const pillText = level === 'safe' ? {en:'low risk',hi:'कम जोखिम',mr:'कमी धोका'}[store.lang]
                    : level === 'high' ? {en:'high risk',hi:'अधिक जोखिम',mr:'जास्त धोका'}[store.lang]
                    : {en:'medium risk',hi:'मध्यम जोखिम',mr:'मध्यम धोका'}[store.lang];
  return `<div class="card">
    <div class="row" style="justify-content:space-between; margin-bottom:6px;">
      <strong style="font-size:13.5px;">${food}</strong>
      <span class="pill ${pillClass}">${pillText}</span>
    </div>
    <div style="font-size:13px; color:var(--text-dim); line-height:1.5;">${message}</div>
  </div>`;
}

function renderHistory(){
  const list = document.getElementById('historyList');
  if(store.history.length === 0){
    list.innerHTML = `<div class="empty">${t('emptyHistory')}</div>`;
    return;
  }
  list.innerHTML = store.history.slice().reverse().map(h=>{
    const pillClass = h.level === 'safe' ? 'safe' : (h.level === 'high' ? 'high' : 'medium');
    const d = new Date(h.ts);
    const timeStr = d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) + ' · ' + d.toLocaleDateString();
    return `<div class="hist-item">
      <div>
        <div style="font-size:13.5px; font-weight:600; margin-bottom:3px;">${h.food} <span class="pill ${pillClass}" style="margin-left:6px;">${h.level}</span></div>
        <div style="font-size:12.5px; color:var(--text-dim);">${h.message}</div>
      </div>
      <div class="hist-time">${timeStr}</div>
    </div>`;
  }).join('');
}

let lastSeenAt = {};
function analyzeText(text){
  const lower = text.toLowerCase();
  const matched = FOODS.filter(f=> f.keys.some(k=> lower.includes(k)));
  if(matched.length === 0) return [];
  const now = Date.now();
  const results = [];
  matched.forEach(food=>{
    if(lastSeenAt[food.id] && (now - lastSeenAt[food.id] < 8000)) return;
    lastSeenAt[food.id] = now;
    const activeConditions = CONDITIONS.filter(c=> store.conditions.includes(c.id) && food.tags.includes(c.tag));
    let level, message;
    if(activeConditions.length === 0){
      level = 'safe';
      message = SAFE_MSG[store.lang](name(food));
    } else {
      level = activeConditions.length > 1 ? 'high' : 'medium';
      const condNames = activeConditions.map(c=>name(c)).join(store.lang==='en' ? ' & ' : ' और ');
      const tagNames = [...new Set(activeConditions.map(c=> (TAG_LABEL[c.tag]&&TAG_LABEL[c.tag][store.lang]) || c.tag))].join(', ');
      message = MSG[store.lang](name(food), condNames, tagNames);
    }
    const entry = {food:name(food), level, message, ts:now};
    store.history.push(entry);
    if(store.history.length > 200) store.history.shift();
    results.push(entry);
  });
  if(results.length) saveStore();
  return results;
}

function pushToHomeFeed(entries){
  const feed = document.getElementById('homeFeed');
  if(feed.querySelector('.empty')) feed.innerHTML = '';
  entries.forEach(e=>{
    const wrap = document.createElement('div');
    wrap.innerHTML = riskCardHTML(e.food, e.level, e.message);
    feed.prepend(wrap.firstElementChild);
  });
}

function renderHomeFeedFromHistory(){
  const feed = document.getElementById('homeFeed');
  const recent = store.history.slice(-8).reverse();
  if(recent.length === 0){
    feed.innerHTML = `<div class="empty">${t('emptyHome')}</div>`;
    return;
  }
  feed.innerHTML = recent.map(e=> riskCardHTML(e.food, e.level, e.message)).join('');
}

/* ---------------- Voice advice (text-to-speech) ---------------- */
let pausedForSpeech = false;

function pickVoice(lang){
  if(!('speechSynthesis' in window)) return null;
  const voices = speechSynthesis.getVoices();
  if(!voices || voices.length === 0) return null;
  const sameLang = voices.filter(v => v.lang === lang);
  const sameBase = voices.filter(v => v.lang && v.lang.startsWith(lang.split('-')[0]));
  const pool = sameLang.length ? sameLang : sameBase;
  if(pool.length === 0) return null;
  // Network/neural voices (Google, Microsoft Natural, Wavenet) sound far less robotic
  // than the default on-device engine most desktop browsers fall back to.
  const natural = pool.find(v => /google|natural|wavenet|neural/i.test(v.name));
  const female = pool.find(v => /female|woman|samantha|zira|veena/i.test(v.name));
  return natural || female || pool[0];
}

function speakEntries(entries){
  if(!store.voiceOn || !('speechSynthesis' in window) || entries.length === 0) return;
  if(recognizing){
    pausedForSpeech = true;
    try{ recognition.stop(); }catch(e){}
  }
  const targetLang = SPEECH_LOCALE[store.lang] || 'en-IN';
  entries.forEach((entry, idx)=>{
    const utter = new SpeechSynthesisUtterance(entry.message);
    utter.lang = targetLang;
    utter.rate = 0.92;
    utter.pitch = 1.03;
    const voice = pickVoice(targetLang);
    if(voice) utter.voice = voice;
    if(idx === entries.length - 1){
      const resume = ()=>{
        pausedForSpeech = false;
        if(recognizing){ try{ recognition.start(); }catch(e){} }
      };
      utter.onend = resume;
      utter.onerror = resume;
    }
    speechSynthesis.speak(utter);
  });
}

/* ---------------- Speech recognition ---------------- */
let recognition = null;
let recognizing = false;
const SpeechRecognitionImpl = window.SpeechRecognition || window.webkitSpeechRecognition;

function setupRecognition(){
  if(!SpeechRecognitionImpl){
    document.getElementById('micLabel').textContent = 'Voice not supported in this browser — use the text box below';
    document.getElementById('micBtn').style.opacity = '0.4';
    document.getElementById('micBtn').onclick = null;
    return;
  }
  recognition = new SpeechRecognitionImpl();
  recognition.continuous = true;
  recognition.interimResults = true;
  recognition.lang = SPEECH_LOCALE[store.lang] || 'en-IN';

  recognition.onresult = (event)=>{
    let interim = '';
    let final = '';
    for(let i = event.resultIndex; i < event.results.length; i++){
      const transcript = event.results[i][0].transcript;
      if(event.results[i].isFinal) final += transcript + ' ';
      else interim += transcript;
    }
    document.getElementById('liveTranscript').textContent = (final + interim).trim();
    if(final.trim()){
      const entries = analyzeText(final);
      if(entries.length){
        pushToHomeFeed(entries);
        speakEntries(entries);
      }
    }
  };
  recognition.onerror = (e)=>{
    if(e.error === 'no-speech' || e.error === 'aborted') return;
    stopListening();
  };
  recognition.onend = ()=>{
    if(recognizing && !pausedForSpeech){ try{ recognition.start(); }catch(e){} }
  };
}

function startListening(){
  if(!recognition) return;
  recognition.lang = SPEECH_LOCALE[store.lang] || 'en-IN';
  try{ recognition.start(); }catch(e){}
  recognizing = true;
  document.getElementById('micBtn').classList.add('listening');
  document.getElementById('micLabel').textContent = t('listening');
}
function stopListening(){
  recognizing = false;
  if(recognition){ try{ recognition.stop(); }catch(e){} }
  document.getElementById('micBtn').classList.remove('listening');
  document.getElementById('micLabel').textContent = t('tapToListen');
  document.getElementById('liveTranscript').textContent = '';
}

/* ---------------- Tabs ---------------- */
function showTab(tab){
  document.querySelectorAll('.screen').forEach(s=> s.classList.remove('active'));
  document.getElementById('screen-'+tab).classList.add('active');
  document.querySelectorAll('nav .tab').forEach(b=> b.classList.toggle('active', b.dataset.tab === tab));
  if(tab === 'history') renderHistory();
  if(tab === 'home') renderHomeFeedFromHistory();
}

/* ---------------- Wire up ---------------- */
document.querySelectorAll('nav .tab').forEach(b=>{
  b.addEventListener('click', ()=> showTab(b.dataset.tab));
});

document.getElementById('micBtn').addEventListener('click', ()=>{
  if(recognizing) stopListening(); else startListening();
});

function runManualCheck(){
  const input = document.getElementById('manualInput');
  if(!input.value.trim()) return;
  const entries = analyzeText(input.value);
  if(entries.length){
    pushToHomeFeed(entries);
    speakEntries(entries);
  }
}

document.getElementById('manualBtn').addEventListener('click', runManualCheck);
document.getElementById('manualInput').addEventListener('keydown', e=>{
  if(e.key === 'Enter') runManualCheck();
});

let manualDebounce = null;
document.getElementById('manualInput').addEventListener('input', ()=>{
  clearTimeout(manualDebounce);
  manualDebounce = setTimeout(runManualCheck, 1100);
});

document.getElementById('voiceToggleBtn').addEventListener('click', ()=>{
  store.voiceOn = !store.voiceOn;
  saveStore();
  document.getElementById('voiceToggleState').textContent = store.voiceOn ? t('voiceOn') : t('voiceOff');
  document.getElementById('voiceToggleBtn').classList.toggle('active', store.voiceOn);
});

document.getElementById('testVoiceBtn').addEventListener('click', ()=>{
  if(!('speechSynthesis' in window)){
    document.getElementById('voiceInfo').textContent = 'This browser has no speech voice available.';
    return;
  }
  const sample = {
    en: "Oh sweetheart, just go a little easy today, alright?",
    hi: "अरे बेटा, आज थोड़ा संभल के खाना, ठीक है?",
    mr: "अरे बाळा, आज जरा जपून खा हं?",
  }[store.lang];
  const targetLang = SPEECH_LOCALE[store.lang] || 'hi-IN';
  const utter = new SpeechSynthesisUtterance(sample);
  utter.lang = targetLang;
  utter.rate = 0.92;
  utter.pitch = 1.03;
  const voice = pickVoice(targetLang);
  if(voice) utter.voice = voice;
  document.getElementById('voiceInfo').textContent = voice
    ? `Using: ${voice.name} (${voice.lang})`
    : `No installed voice found for ${targetLang} — your system may need a Hindi voice pack, or try this in Chrome on Android.`;
  speechSynthesis.speak(utter);
});

document.getElementById('langSelect').addEventListener('change', (e)=>{
  store.lang = e.target.value;
  saveStore();
  applyStaticText();
  renderConditions();
  renderHomeFeedFromHistory();
  renderHistory();
});

document.getElementById('clearBtn').addEventListener('click', ()=>{
  if(confirm(t('confirmClear'))){
    localStorage.removeItem(STORE_KEY);
    store = {conditions:[], lang: store.lang, history:[]};
    saveStore();
    renderConditions();
    renderHomeFeedFromHistory();
    renderHistory();
    alert(t('cleared'));
  }
});

/* ---------------- Init ---------------- */
applyStaticText();
renderConditions();
renderHomeFeedFromHistory();
setupRecognition();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
